<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerRent.es</title>
    <script>
        document.getElementById('submit-btn').addEventListener('click', function () {
        document.querySelectorAll('.error-message').forEach(function (element) {
            element.textContent = '';
        });

        var nombre = document.getElementById('nombre').value.trim();
        var telefono = document.getElementById('telefono').value.trim();
        var email = document.getElementById('email').value.trim();
        var comentarios = document.getElementById('comentarios').value.trim();
        var politica = document.getElementById('politica').checked;

        var hasError = false;

        if (nombre === '') {
            document.getElementById('nombre-error').textContent = 'Por favor, ingresa tu nombre.';
            hasError = true;
        }

        if (!/^\d{9}$/.test(telefono)) {
            document.getElementById('telefono-error').textContent = 'El teléfono debe contener 9 números.';
            hasError = true;
        }

        if (!/\S+@\S+\.\w+/.test(email)) {
            document.getElementById('email-error').textContent = 'Por favor, ingresa un email válido.';
            hasError = true;
        }

        if (!politica) {
            document.getElementById('politica-error').textContent = 'Debes aceptar la política de privacidad.';
            hasError = true;
        }

        if (!hasError) {
            document.getElementById('success-message').textContent = 'Formulario enviado correctamente!';
            document.getElementById('form').reset();
        }
    });
    </script>
    <style>

}

.imagenlogo {

        body {

        .dropdown {

        }
        .dropdown-content {

            min-width: 120px;

        }
        .dropbtn{
    width: 100%;
    height: 50px;
    border: 1px solid;
    background: grey;
    border-radius: 25px;
    font-size: 18px;
    color: white;
    cursor: pointer;

}
.dropbtn:hover{

.inicio{
    width: 100%;
    text-align: center;
}
#contact-form {
            background-color: #fff;

            border-radius: 10px;

        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        textarea {

            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        }

        #submit-btn {
            background-color: #4caf50;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #submit-btn:hover {

        }
